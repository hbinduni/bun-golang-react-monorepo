# Version updates are separate from vulnerability detection; major upgrades remain separate.
version: 2
updates:
  - package-ecosystem: bun
    directories:
      - /
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directories:
      - /client
      - /k8s
      - /server
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: docker-compose
    directories:
      - /
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: gomod
    directories:
      - /server
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
